name: tofu

# Pull requests get a plan as a comment. On main the plan is saved, and the
# apply job runs exactly that plan once the "prod" environment is approved.
on:
  pull_request:
    paths:
      - "tofu/**"
      - "bootstrap/**"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - "bootstrap/**"
      - ".github/workflows/tofu.yml"
  workflow_dispatch:

concurrency:
  group: tofu-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: 1.13.9
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  VAR_FILE: environments/prod.tfvars
  PLAN_FILE: prod.tfplan

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: prod-plan
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
      TF_VAR_admin_ips: ${{ secrets.ADMIN_IPS }}
      TF_VAR_r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
      TF_VAR_k3s_token: ${{ secrets.K3S_TOKEN }}
      TF_VAR_etcd_s3_access_key: ${{ secrets.ETCD_S3_ACCESS_KEY }}
      TF_VAR_etcd_s3_secret_key: ${{ secrets.ETCD_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - run: tofu -chdir=tofu init -var-file="$VAR_FILE"

      - id: plan
        run: |
          set +e
          tofu -chdir=tofu plan -var-file="$VAR_FILE" -out="$PLAN_FILE" -detailed-exitcode -no-color
          code=$?
          set -e
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - if: github.event_name == 'pull_request'
        run: tofu -chdir=tofu show -no-color "$PLAN_FILE" > plan.txt

      - if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tofu-plan-prod -->';
            const maxLength = 60000;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > maxLength) {
              plan = plan.slice(0, maxLength) + '\n... truncated, see the job log';
            }
            const body = `${marker}\n### tofu plan (prod)\n\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - if: github.event_name != 'pull_request' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: tofu/${{ env.PLAN_FILE }}
          retention-days: 7

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    environment: prod
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
      TF_VAR_admin_ips: ${{ secrets.ADMIN_IPS }}
      TF_VAR_r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
      TF_VAR_k3s_token: ${{ secrets.K3S_TOKEN }}
      TF_VAR_etcd_s3_access_key: ${{ secrets.ETCD_S3_ACCESS_KEY }}
      TF_VAR_etcd_s3_secret_key: ${{ secrets.ETCD_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: tofu

      - run: tofu -chdir=tofu init -var-file="$VAR_FILE"

      - run: tofu -chdir=tofu apply -no-color "$PLAN_FILE"
